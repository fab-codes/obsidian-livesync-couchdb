; CouchDB - configuration for Obsidian Self-hosted LiveSync.
;
; Config is read in this order, last one wins:
;   default.ini -> default.d/*.ini -> local.ini -> local.d/*.ini
; This file is in local.d/, followed there by 20-port.ini (generated at
; startup) and docker.ini (where the official entrypoint writes [admins] and
; where CouchDB saves changes made at runtime from Fauxton).

[couchdb]
; Creates _users / _replicator / _global_changes on first boot, so there is
; no need to call POST /_cluster_setup by hand.
single_node = true

; Maximum size of a single document: 50 MB, up from the 8 MB default.
; LiveSync splits files into chunks, but large attachments need the headroom.
max_document_size = 50000000

[cluster]
; Single node: one replica per shard.
n = 1

[chttpd]
; Listen on every interface (inside the container). The port is written at
; runtime by entrypoint.sh into 20-port.ini, based on $PORT.
bind_address = any

; No anonymous access: every request must carry valid credentials.
require_valid_user = true

; Exception for /_up, otherwise the platform healthcheck would get a 401 and
; the deployment would be marked as failed.
require_valid_user_except_for_up = true

; 4 GB. Already CouchDB's own default: spelled out because the LiveSync
; documentation asks for it, and so the smoke test can assert it.
max_http_request_size = 4294967296

enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
; Makes the browser show the Basic auth prompt instead of a bare error page.
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; Origins Obsidian talks from:
;   app://obsidian.md     -> desktop (Windows/macOS/Linux)
;   capacitor://localhost -> iOS / iPadOS
;   http://localhost      -> Android
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
